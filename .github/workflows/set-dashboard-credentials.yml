name: Set Dashboard Credentials

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Set DASHBOARD_USERNAME
        run: printf '%s' "$DASHBOARD_USERNAME" | npx wrangler secret put DASHBOARD_USERNAME
        env:
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}

      - name: Set DASHBOARD_PASSWORD
        run: printf '%s' "$DASHBOARD_PASSWORD" | npx wrangler secret put DASHBOARD_PASSWORD
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
