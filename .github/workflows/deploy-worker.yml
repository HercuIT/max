name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "*.ts"
      - "scripts/**"
      - "tests/**"
      - "tsconfig.json"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/deploy-migrations.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep the migration and Worker deployment from different releases serialized.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-validation-{0}', github.event.pull_request.number) || 'production-deployment' }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:database
      - run: npm run test:online
      - run: npm run test:organizations
      - run: npm run test:dashboard
      - name: Create isolated PostgreSQL test databases
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const db=new pg.Client({connectionString:'postgresql://postgres:local-test-only@127.0.0.1:5432/postgres'});
          await db.connect();
          try { for (const name of ['tenant_concurrency','tenant_online','tenant_staged']) await db.query('create database '+name); }
          finally { await db.end(); }
          JS
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/tenant_concurrency
      - run: npm run test:online:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/tenant_online
      - run: npm run test:staged
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/tenant_staged
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx wrangler deploy compatibility.ts --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

  migrations:
    if: github.event_name != 'pull_request'
    needs: validation
    uses: ./.github/workflows/deploy-migrations.yml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
